version: '3.8'

services:
  backend:
    build: ./backend
    container_name: aura-recommendation-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/workspace/data/ott_recommendation.db
      - MODEL_DIR=/workspace/models
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:3000,http://127.0.0.1:8080
      - MLFLOW_TRACKING_URI=sqlite:////workspace/mlflow.db
      - MLFLOW_ARTIFACT_ROOT=file:///workspace/mlruns
      - MLFLOW_EXPERIMENT_NAME=OTT Recommendation System
    volumes:
      - ./backend/data:/workspace/data
      - ./backend/models:/workspace/models
      - ./backend/mlruns:/workspace/mlruns
      - ./backend/mlflow.db:/workspace/mlflow.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  mlflow-ui:
    build: ./backend
    container_name: aura-recommendation-mlflow-ui
    command: mlflow ui --backend-store-uri sqlite:///workspace/mlflow.db --default-artifact-root file:///workspace/mlruns --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/mlruns:/workspace/mlruns
      - ./backend/mlflow.db:/workspace/mlflow.db
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: aura-recommendation-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: aura-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:9.5.0
    container_name: aura-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  grafana-storage:
    driver: local
