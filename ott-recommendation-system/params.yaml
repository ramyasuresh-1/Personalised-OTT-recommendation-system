# OTT Recommendation System - Phase 1 Configuration

# Data parameters
data:
  random_seed: 42
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  remove_duplicates: false

# Model parameters
model:
  algorithm: funk_svd
  latent_factors: 6
  epochs: 35
  learning_rate: 0.05
  regularization: 0.02
  random_state: 42

# Evaluation parameters
evaluation:
  k_values:
    - 5
    - 10
  test_data_ratio: 0.15

# Preprocessing
preprocess:
  output_dir: backend/data/processed
  filename: ratings_processed.csv

# Splits
split:
  output_dir: backend/data/splits
  train_file: train.csv
  validation_file: validation.csv
  test_file: test.csv

# MLflow
mlflow:
  experiment_name: OTT Recommendation System
  phase: phase_1
  tags:
    model_type: funk_svd
    evaluation_type: baseline
