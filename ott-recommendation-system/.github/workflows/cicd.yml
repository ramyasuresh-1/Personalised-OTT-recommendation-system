name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  PYTHON_VERSION: '3.10'
  REGISTRY: ghcr.io

jobs:
  # ===== Phase 1: Validate Code Syntax and Linting =====
  code-validation:
    name: Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Compile Backend Code
        run: |
          echo "Validating Python compilation..."
          python -m compileall backend/app
          if [ $? -ne 0 ]; then
            echo "❌ Compilation failed!"
            exit 1
          fi
          echo "✓ Compilation successful"

      - name: Lint with flake8
        run: |
          echo "Running flake8 linting..."
          # Stop on critical errors
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          if [ $? -ne 0 ]; then
            echo "❌ Critical linting errors found!"
            exit 1
          fi
          # Warnings only (exit-zero)
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          echo "✓ Linting passed"

  # ===== Phase 2: Run All Unit and Integration Tests =====
  testing:
    name: Unit & Integration Tests
    needs: code-validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Full Test Suite
        run: |
          echo "Running full test suite (Phases 1-6)..."
          pytest backend/tests -v --tb=short --junitxml=junit/test-results.xml
          if [ $? -ne 0 ]; then
            echo "❌ Test suite failed!"
            exit 1
          fi
          echo "✓ All tests passed"

      - name: Generate Coverage Report
        run: |
          echo "Generating coverage report..."
          pytest backend/tests --cov=backend/app --cov-report=xml --cov-report=html --cov-report=term-missing
          if [ $? -ne 0 ]; then
            echo "⚠ Coverage report generation failed (tests may have passed)"
          else
            echo "✓ Coverage report generated"
          fi

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pytest-results
          path: junit/test-results.xml

  # ===== Phase 3: MLOps Component Validation =====
  mlops-validation:
    name: MLOps Regression Tests
    needs: code-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Verify Phase 1 - Data Pipeline Tests
        run: |
          echo "Testing Phase 1 - Data Pipeline..."
          pytest backend/tests/test_data_split.py backend/tests/test_data_validation.py -v
          echo "✓ Phase 1 tests passed"

      - name: Verify Phase 3 - Model Evaluation Tests
        run: |
          echo "Testing Phase 3 - Model Evaluation..."
          pytest backend/tests/test_evaluation.py backend/tests/test_phase3_evaluation.py -v
          echo "✓ Phase 3 tests passed"

      - name: Verify Phase 4 - Monitoring Tests
        run: |
          echo "Testing Phase 4 - Monitoring..."
          pytest backend/tests/test_api.py -v
          echo "✓ Phase 4 tests passed"

      - name: Verify Phase 5 - Drift Detection Tests
        run: |
          echo "Testing Phase 5 - Drift Detection..."
          pytest backend/tests/test_phase5_monitoring.py backend/tests/test_phase5_validation.py -v
          echo "✓ Phase 5 tests passed"

      - name: Verify Phase 6 - Automated Retraining Tests
        run: |
          echo "Testing Phase 6 - Automated Retraining..."
          pytest backend/tests/test_phase6_retraining.py -v
          echo "✓ Phase 6 tests passed"

  # ===== Phase 4: Infrastructure Validation =====
  infrastructure-validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          echo "Validating Docker Compose configuration..."
          docker-compose config > /dev/null
          if [ $? -ne 0 ]; then
            echo "❌ Docker Compose configuration is invalid!"
            exit 1
          fi
          echo "✓ Docker Compose configuration is valid"

      - name: Validate DVC Configuration
        run: |
          echo "Checking DVC files..."
          if [ -f dvc.yaml ]; then
            echo "✓ dvc.yaml found"
          else
            echo "⚠ dvc.yaml not found"
          fi
          if [ -f .dvc/config ]; then
            echo "✓ DVC config found"
          else
            echo "⚠ DVC config not found"
          fi

  # ===== Phase 5: Docker Build Validation =====
  docker-build:
    name: Docker Build Validation
    needs: [ code-validation, testing ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: aura-ott/recommendation-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Dockerfile Syntax
        run: |
          echo "Validating Dockerfile..."
          docker run --rm -i hadolint/hadolint < backend/Dockerfile || true
          echo "✓ Dockerfile validated"

  # ===== Phase 6: Security Checks =====
  security-checks:
    name: Security Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Secrets
        run: |
          echo "Scanning for potential secrets..."
          if grep -r "api_key\|password\|secret\|token" backend/app --include="*.py" | grep -v "^[[:space:]]*#" | grep -v "def \|class \|import " > /dev/null; then
            echo "⚠ Potential secrets found in code (verify they are not actual secrets):"
            grep -r "api_key\|password\|secret\|token" backend/app --include="*.py" || true
          else
            echo "✓ No obvious secrets detected"
          fi

      - name: Verify No Hard-Coded Credentials
        run: |
          echo "Checking for hard-coded credentials..."
          if grep -r "mlflow\|render\|deploy" backend/app --include="*.py" | grep -i "url\|password\|token" | grep -v "^[[:space:]]*#" > /dev/null; then
            echo "⚠ Potential credential patterns found (verify none are exposed):"
            grep -r "mlflow\|render\|deploy" backend/app --include="*.py" | grep -i "url\|password\|token" || true
          else
            echo "✓ No hard-coded credentials detected"
          fi

  # ===== Phase 7: Comprehensive Status Check =====
  ci-status:
    name: CI Status Summary
    needs: [ code-validation, testing, mlops-validation, infrastructure-validation, docker-build, security-checks ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.code-validation.result }}" == "failure" ] || \
             [ "${{ needs.testing.result }}" == "failure" ] || \
             [ "${{ needs.mlops-validation.result }}" == "failure" ] || \
             [ "${{ needs.infrastructure-validation.result }}" == "failure" ] || \
             [ "${{ needs.docker-build.result }}" == "failure" ] || \
             [ "${{ needs.security-checks.result }}" == "failure" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          else
            echo "✅ CI Pipeline Passed"
            echo "All validation stages completed successfully:"
            echo "  ✓ Code Validation"
            echo "  ✓ Testing"
            echo "  ✓ MLOps Regression Tests"
            echo "  ✓ Infrastructure Validation"
            echo "  ✓ Docker Build"
            echo "  ✓ Security Checks"
          fi
